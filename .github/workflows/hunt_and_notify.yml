name: Ourson Hunter 8-Hour Autonomous Cycle

on:
  schedule:
    # Tourne toutes les 8 heures (00:15, 08:15, 16:15 UTC)
    # Décalé à la minute 15 pour garantir l'exécution sans file d'attente GitHub
    - cron: '15 0,8,16 * * *'
  workflow_dispatch: # Permet de déclencher manuellement le scan depuis GitHub

# Permissions requises pour pousser les mises à jour
permissions:
  contents: write

jobs:
  hunt_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🐻 Exécuter le cycle de veille et d'alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python core/scheduler_runner.py

      - name: 💾 Sauvegarder les données publiques à jour
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Ourson Hunter Bot"
          git add -A data/ public/ web/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update jobs & matching [skip ci]"
            git push origin main
          else
            echo "Aucun changement détecté à pousser."
          fi
