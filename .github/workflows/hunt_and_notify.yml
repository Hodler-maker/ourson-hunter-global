name: ANFAANI 8-Hour Autonomous Cycle

on:
  schedule:
    # Tourne toutes les 8 heures (00:15, 08:15, 16:15 UTC)
    # Decale a la minute 15 pour garantir l'execution sans file d'attente GitHub
    - cron: '15 0,8,16 * * *'
  workflow_dispatch: # Permet de declencher manuellement le scan depuis GitHub

# Permissions requises pour pousser les mises a jour
permissions:
  contents: write

jobs:
  hunt_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer le cycle de veille et d'alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python core/scheduler_runner.py

      - name: Sauvegarder les donnees publiques a jour
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ANFAANI Bot"
          git add -A data/ public/ web/ public_jobs.json public_events.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update jobs and matching [skip ci]"
            git push origin main
          else
            echo "Aucun changement detecte a pousser."
          fi
